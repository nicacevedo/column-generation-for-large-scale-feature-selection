[project]
name = "cg-sparse-regression"
version = "0.1.0"
description = "Column generation for large-scale feature selection: 2026 reassessment of the 2023 master's thesis."
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "numpy>=2.1",
    "scipy>=1.14",
    "scikit-learn>=1.6",
    "pandas>=2.2",
    "matplotlib>=3.9",
    "psutil>=6.0",
]

[project.optional-dependencies]
# The conic path. MOSEK is what the 2023 work used and is not licensed on this
# host, so Clarabel is the interior-point conic solver actually available. Any
# timing produced with it is an independent reimplementation's timing and is
# labelled as such -- never as a reproduction of a MOSEK number.
conic = [
    "cvxpy>=1.6",
    "clarabel>=0.9",
    "ecos>=2.0",
    "scs>=3.2",
]
# The modern baselines the 2023 comparison predates.
baselines = [
    "celer>=0.7.4",
    "skglm>=0.4",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100
# The historical code is the historical record. Linting it would invite fixing
# it, and a fixed copy is no longer the thing that produced the 2023-2025
# results. `src/cg2026/cg_hist_compat.py` carries the smallest diff that makes
# `src/cg_models.py` execute in 2026 and is excluded for the same reason.
exclude = [
    "models.py",
    "new_main.py",
    "new_main_delete.py",
    "old_main.py",
    "stocks_data.py",
    "synthetic_data.py",
    "src/cg_models.py",
    "src/cg2026/cg_hist_compat.py",
    # The thesis-era notebooks, for the same reason and one more: they carry
    # committed cell outputs, so reformatting them rewrites a record of what
    # the author actually ran. Listed individually rather than as `*.ipynb`, so
    # a notebook written for the 2026 reassessment would still be linted.
    "plots.ipynb",
    "borrar.ipynb",
    "data-treatment.ipynb",
    "benchmark/qp_vs_socp.ipynb",
    "Finance/market_analysis.ipynb",
]
