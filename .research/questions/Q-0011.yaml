statement: 'HYP-0004 asserts that ''there exist reachable dual points at which it exceeds
  the primal optimum''. The project has no definition of reachable. Candidates that give materially
  different claims: (a) the iterates actually produced by the historical loop on some instance;
  (b) any optimal dual of a restricted master over some subset of coordinates; (c) any point
  in the dual feasible region of some restricted master, optimal or not. Under (a) the claim
  is about this implementation; under (b) it is about the decomposition; under (c) it is nearly
  vacuous. Until one is fixed, a null result from PR-005 cannot be interpreted, because a
  search over (a) that finds nothing says nothing about (b).'
